name: workers-configurator
description: "Create, validate, review, and test Orchestra agent configurations (plugins, roles, flows, tasks, MCP entities)"
session:
  skills:
    - skills/system-model/SKILL.md
  capabilities:
    - create-plugin
    - create-role
    - create-flow
    - create-task
    - create-mcp
    - test-agent
    - design-agent
    - find-external-skills
    - adapt-external-skill
    - review-plugin
    - capture-and-design
    - draft-entities
    - validate-and-review
    - test-and-iterate
  hooks:
    SessionStart:
      - name: "Introduce configurator capabilities"
        command: |
          echo "You have the ability to design and configure autonomous agent capabilities in Orchestra — the meta-processes that define how agents work: plugins, roles, flows, tasks, and MCP entities."
          echo ""
          echo "Start by invoking the system-model skill (/workers-configurator:system-model) — it maps the entire system: entity types, how they connect, and how the runner assembles them into working agent sessions."
    PreToolUse:
      - name: "Block direct skill installation"
        matcher: "Bash"
        command: |
          # Claude Code sends the tool call as JSON on stdin ($CLAUDE_TOOL_INPUT
          # does not exist). Read it with jq directly; dash's echo would rewrite
          # the JSON's backslash escapes. Only a Bash call has a command; every
          # other tool passes.
          CMD=$(jq -r '.tool_input.command // empty' 2>/dev/null)
          [ -n "$CMD" ] || exit 0
          if printf '%s\n' "$CMD" | grep -qE '(^|[^[:alnum:]_-])skills[[:space:]]+add([[:space:]]|$)'; then
            echo 'BLOCKED: Do not install skills directly. Use npx skills find to search, then adapt the content into the workspace repo format.' >&2
            exit 2
          fi
          exit 0
flows:
  - design-agent
  - flow-creation

name: design-agent
version: 1
description: "End-to-end agent design, creation, and testing"
params:
  configurator:
    type: worker
on:
  workflow_dispatch: true
jobs:
  design:
    type: agent
    task: design-agent
    worker: $configurator
    timeout: 60m
  test:
    type: agent
    task: test-agent
    worker: $configurator
    needs: [design]
    timeout: 30m

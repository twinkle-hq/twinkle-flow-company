name: test-and-iterate
description: >
  Test the created configuration by running realistic scenarios in sandbox,
  comparing the produced artifacts with and without the configuration (baseline),
  grading the produced entity files + their flows-lint result against assertions,
  aggregating benchmarks, analyzing patterns, and iteratively improving until
  quality is satisfactory. Grades on artifacts, not execution-log content.
  Adapted from the skill-creator evaluation cycle.
trigger: >
  Configuration has been reviewed and approved, and needs real-world testing
  in sandbox before being considered production-ready
complexity: medium
outputs:
  - test_results
  - benchmark_report
  - improvements_applied

hard_gates:
  - before: run-tests
    rule: >
      Test cases must exist (from Brief or designed now). Do not run tests
      without specific prompts, expected outcomes, and verification criteria.
  - before: run-tests
    rule: >
      Every `twinkle worker create` in this lane MUST carry an explicit
      `--git_repo` naming a sandbox repository that already exists. Omitted, and
      wherever the BFF can resolve a GitHub token, the handler auto-creates a
      REAL private GitHub repository named `twinkle-<ws>-worker-<name>`, and
      nothing here — `twinkle worker stop`, `twinkle worker delete` — ever
      deletes one. This lane creates a worker per test case per arm, each under
      its own name, so an omitted flag leaks a repo per run, multiplied.
  - before: grade
    rule: >
      All test runs (both with-config and baseline) must have completed before
      grading. Do not grade partial results.
  - before: improve
    rule: >
      Analysis must be complete before making improvements. Do not change
      configuration based on gut feeling — use evidence from grading and analysis.

anti_rationalization:
  title: "Shortcuts that undermine testing quality"
  entries:
    - thought: "The review passed so the configuration should work in practice"
      reality: "Review checks structure and design. Only real execution reveals runtime failures — wrong MCP tools, missing context, bad phase flow, agent rationalization."
    - thought: "One test case is enough to verify the configuration works"
      reality: "A single test can pass by luck. Multiple test cases with different scenarios reveal systematic issues. Use at least 2 from the Brief."
    - thought: "I don't need a baseline — just test with the configuration"
      reality: "Without baseline, you can't measure improvement. The with/without comparison is what proves the configuration adds value."
    - thought: "The test passed, the agent is ready for production"
      reality: "A 'done' status doesn't mean the agent worked well. Inspect the artifacts: do the produced entity files have the right structure, and does flows lint pass clean? Malformed or lint-failing entities behind a 'done' status is a failure. (Behavioral log analysis — phase order, skipped steps — is NOT available: `twinkle run list --task_id <id> --limit 1` returns only the run row, not the trace.)"
    - thought: "I'll fix the configuration and skip re-testing — the fix is obviously correct"
      reality: "Every fix needs re-testing. Obvious fixes can break other test cases. Run the full suite again."
    - thought: "Assertions are overkill for this, I can just eyeball the results"
      reality: "Assertions make evaluation repeatable and objective. Without them, you'll miss regressions in future iterations."
    - thought: "I'll leave `--git_repo` off the test workers — the platform will sort it out"
      reality: "Where it can resolve a GitHub token it sorts it out by CREATING a real private GitHub repository named `twinkle-<ws>-worker-<name>`, and neither `twinkle worker stop` nor `twinkle worker delete` removes one. This lane creates a worker per test case per arm, each under its own name, so that is a repo leak multiplied by the suite size. (With no resolvable token nothing is created and the call is refused `400 NO_GIT_REPO` — a failed create either way.) Name an existing sandbox repo on every create."
    - thought: "A `twinkle worker create` came back 403 — the test environment is flaky, retry"
      reality: "403 from the worker vhost is a scope answer, not a transient one. `worker create`, `worker delete`, `worker status` and `tracker worker-config` are `scope: 'admin'` and the worker vhost admits only `scope: 'worker'`. Retrying cannot change it — see the 'Scope' section, report it, and stop."

phases:
  prepare-tests:
    tools: [Bash, Read, Glob]
    goal: "Set up test environment and finalize test cases"
    actions:
      - text: "Read test cases from the Brief (injected from Job 1 dependency)"
        why: "Test cases were designed during requirements gathering. They reflect the user's definition of success."
      - "If Brief test cases are insufficient, design additional ones — but prefer the originals"
      - text: >
          For each test case, prepare:
          - Realistic prompt (what a user would actually type)
          - Expected outcome (specific artifacts, behaviors, outputs)
          - Assertions (concrete, verifiable criteria — not subjective)
        why: "Vague test cases produce vague results. Specific assertions enable objective grading."
      - "Prepare the sandbox environment: identify which worker role/plugins to test with"
    gate: "Test cases finalized with prompts, expected outcomes, and assertions. Sandbox environment ready."
    next: run-tests

  run-tests:
    tools: ["twinkle worker create", "twinkle worker start", "twinkle task create", "twinkle tracker worker-config"]
    goal: "Execute test cases with configuration and baseline in parallel"
    actions:
      - text: >
          For each test case, run TWO tests in parallel:
          1. With-config: worker with the new configuration (role/plugins)
          2. Baseline: worker without the configuration (or with previous version)
          Launch all runs at once — don't wait for one to finish before starting the next.
        why: "Parallel execution saves time. With/without comparison is essential to prove the configuration adds value."
      - text: >
          For each run, three commands:
          `twinkle worker create <ws> <run-name> --git_repo <existing sandbox repo URL>
          --plugins <p> [--plugins <p> ...]`,
          then `twinkle task create --workspace <ws> --title <t> --description <test prompt>
          --labelIds <the run worker's label id, from twinkle tracker worker-config <ws> <run-name>>`,
          then `twinkle worker start <ws> <run-name>`.
        why: >
          `<ws>` and the worker name are POSITIONALS on `worker create` and
          `worker start` — neither takes a `--workspace` flag, and passing one
          is a usage error. `--git_repo` is mandatory (hard gate above). The
          baseline arm is the same three commands with the configuration's
          plugins omitted (or the previous version's).
      - "Set reasonable timeouts (10-15 minutes per test)"
      - "Save results to organized workspace: iteration-{N}/eval-{ID}/{with_config|baseline}/"
    gate: "All test runs launched (both with-config and baseline for each test case)"
    next: draft-assertions

  draft-assertions:
    goal: "While tests run, formalize ARTIFACT-based assertions for each test case"
    actions:
      - text: >
          For each test case, write concrete assertions over the ARTIFACTS the
          agent produces — not over execution-log content (`twinkle run list
          --task_id <id> --limit 1` returns only the run row, never the
          behavioral trace):
          - Did the agent reach a terminal status, and are the declared outputs
            present and non-empty in result.md?
          - Do the expected entity files exist with the expected structure?
            (Glob/Read plugins/<name>/plugin.yaml, tasks/*.yaml, flows/*.yaml,
            roles/*.yaml, mcp/*.yaml — check fields, not just existence.)
          - Does `flows lint --format=json` over the produced entities return []
            (exit 0)? Lint findings = hard fail.
          - Are the produced outputs CORRECT (right phases/triggers/outputs), not
            merely present?
        why: "Assertions must be objectively verifiable. 'Looks good' is not an assertion. 'plugins/x/plugin.yaml exists, lists flow y, and flows lint is clean' is. Behavioral assertions ('agent followed phases in order') are NOT checkable here — see the honesty note."
      - "Good assertions are discriminating — they pass when the config works, fail when it doesn't"
      - "Avoid assertions that are trivially satisfied (checking a file exists but not its content)"
      - "Save assertions alongside test cases for grading"
    gate: "Artifact-based assertions written for each test case, objectively verifiable"
    next: collect-results

  collect-results:
    tools: ["twinkle worker status", "twinkle task get", "twinkle run list", Read, Glob, Bash, "twinkle worker stop", "twinkle worker delete"]
    goal: "Collect the artifacts from all test runs"
    actions:
      - "Wait for all test runs to complete (poll `twinkle worker status <ws> <run-name> --json`)"
      - text: >
          For each completed run, collect the gradeable ARTIFACTS:
          - `twinkle task get <task-id>` — terminal status + result.md summary + declared outputs
          - Glob/Read the entity files the run produced (the agent commits them
            into its worker repo)
          - Run `flows lint --format=json` over the produced entities and capture
            the result (exit code + diagnostics)
        why: "We grade on artifacts. `twinkle run list --task_id <id> --limit 1` returns only the run row (tokens, cost, duration) — not the JSONL trace — so it cannot show HOW the agent worked. The produced entity files + their lint result are the objective evidence."
      - text: >
          `twinkle run list --task_id <id> --limit 1` is where the timing/token
          metrics are — tokens, cost, duration, status on the run row. Save them
          for the benchmark aggregation.
        why: >
          `twinkle task get` reads the TRACKER task (title, state, labels,
          comments); it carries no metrics. The run row is history-service's,
          and it is the run row only — never the JSONL behavioural trace.
      - "Save results, produced entities, lint output, and timing data to workspace directories"
      - text: >
          Clean up every test worker: `twinkle worker stop <ws> <run-name>` then
          `twinkle worker delete <ws> <run-name>`.
        why: >
          `stop` deletes nothing; `delete` removes the config row and the Linear
          label. Neither removes the git repository — which is why every create
          named an existing sandbox repo instead of letting one be made.
    gate: "All artifacts collected (status, entity files, lint result, metrics), all test workers cleaned up"
    next: grade

  grade:
    tools: [Read, Glob, Bash]
    goal: "Evaluate each test run against the artifact-based assertions"
    actions:
      - text: >
          For each test run (with-config and baseline), evaluate every assertion
          against the collected ARTIFACTS:
          - Passed: assertion criteria met, with evidence (the specific file +
            field, or the flows-lint exit-0 result)
          - Failed: assertion criteria not met, with explanation (missing file,
            wrong structure, or the exact lint filepath:line diagnostic)
        why: "Grading must be evidence-based. Every verdict needs proof from the produced entity files, result.md, or the flows-lint output."
      - text: "For with-config runs: the entity-quality + lint result IS the quality signal. Do NOT claim to grade behavioral log quality (phase order, skipped steps, rationalization) — `twinkle run list --task_id <id> --limit 1` cannot supply that trace. If a behavioral signal is genuinely needed, file it as a follow-up requiring the history-service execution-logs platform tool."
      - "For baseline runs: grade the same artifact assertions to establish the comparison baseline"
      - "Save grading results per run"
    gate: "All runs graded with artifact/lint-based verdicts for every assertion"
    next: aggregate-analyze

  aggregate-analyze:
    goal: "Compile benchmark and analyze patterns"
    actions:
      - text: >
          Aggregate results into a benchmark:
          - Pass rate per configuration (with-config vs baseline)
          - Time and token usage per configuration
          - Delta between configurations (does the config improve things?)
        why: "Aggregated metrics reveal whether the configuration actually helps — not just individual test results."
      - text: >
          Analyst pass — look for patterns the aggregate stats might hide:
          - Assertions that always pass regardless of config (non-discriminating — fix the assertion)
          - High-variance results (possibly flaky test or inconsistent agent behavior)
          - Time/token tradeoffs (does the config make the agent slower but more correct?)
          - Tests where baseline outperformed config (configuration is hurting, not helping)
        why: "Aggregate stats can mask problems. The analyst pass surfaces what averages hide."
      - "Produce benchmark summary with key findings"
    gate: "Benchmark compiled, analyst observations documented"
    next: improve

  improve:
    max_iterations: 3
    goal: "Fix configuration issues based on test evidence and iterate"
    actions:
      - text: >
          Based on grading and analysis, identify what to fix:
          - Failed assertions → which phase or gate caused the failure?
          - flows-lint findings on the produced entities → fix the entity template
            or the phase that authors that field
          - Malformed/missing produced entity → strengthen the authoring phase,
            anti-rationalization, or add a hard gate
          - Missing outputs → verify output declarations match actual production
        why: "Improvements must be evidence-based, not speculative. Every change should trace to a specific failed assertion or lint diagnostic from the produced artifacts."
      - text: "Apply fixes to the YAML configuration"
        why: "Change the minimum needed to address the failure. Over-fixing introduces new risks."
      - text: "Re-validate all modified entities (flows lint, flows reliability <task>)"
        why: "Fixes can break validation. Catch issues before re-testing."
      - text: "Re-run all test cases into a new iteration-{N+1}/ directory"
        why: "Every fix needs re-testing. The improvement cycle continues until metrics are satisfactory."
      - type: decide
        high_confidence: "All assertions pass, metrics improved over baseline → ready for human review"
        low_confidence: "Still failing assertions or baseline outperforms → continue iteration"
    gate: "Configuration improved, re-tested, and metrics are satisfactory OR iteration limit reached"
    next: finalize

  finalize:
    goal: "Produce final test report and commit"
    actions:
      - "Compile final benchmark report: iterations run, pass rates, improvements applied, remaining issues"
      - "git commit all configuration changes"
      - type: write_result
        status: done
        summary: "Testing complete after {N} iterations. Pass rate: {rate}%. Config vs baseline delta: {delta}. Improvements: {list}"
    gate: "Final report written, changes committed"
    next: null

sections:
  - name: "Scope, and the repo this lane must not create"
    content: |
      **Scope.** The `twinkle` CLI in a worker session is authenticated **as
      this worker**. Where the runner reaches the platform over the network it
      points the CLI at the WORKER vhost with a `scope: 'worker'` token, and
      that vhost admits only the operations the registry declares
      `scope: 'worker'`. Everything else is refused with **403 at the edge**.

      | command | scope | on a remote machine |
      |---|---|---|
      | `twinkle worker create` | admin | 403 |
      | `twinkle worker delete` | admin | 403 |
      | `twinkle worker status` | admin (alias of `worker.list`) | 403 |
      | `twinkle tracker worker-config` | admin | 403 |
      | `twinkle worker start`, `twinkle worker stop` | worker | works |
      | `twinkle task create`, `twinkle task get` | worker | works |
      | `twinkle run list` | worker | works |

      `twinkle <group> <action> --help` prints the operation's `scope:` line —
      that is the check, not this table. This lane therefore runs end-to-end
      only where the CLI is pointed at a vhost that accepts an admin-scoped
      token: a single-host deployment (the runner sets
      `TWINKLE_URL=http://gateway`, the default vhost, which has no auth
      subrequest) or a session explicitly given an admin profile. On a remote
      machine the first `twinkle worker create` answers 403 and no test runs.
      Record that and stop — it is a fact about where this session runs, not
      about the configuration under test.

      **The repo.** `twinkle worker create` with no `--git_repo` makes the BFF
      resolve a GitHub token — the worker's `--github_token_id`, else the
      workspace's — and, when it gets one, **create a real private GitHub
      repository** named `twinkle-<ws>-worker-<name>`. `twinkle worker delete`
      removes the config row and the Linear label; it does not remove that
      repository, and no command in this CLI does. A suite of N test cases run
      in two arms, each under its own worker name, is 2N leaked repositories
      per iteration. (Where no token resolves nothing is created and the create
      is refused outright, `400 NO_GIT_REPO` — so omitting the flag either
      leaks or fails, never works.) Always pass `--git_repo` naming a sandbox
      repository that already exists and is safe to reuse.

  - name: "Writing Good Assertions"
    content: |
      Good assertions are:
      - **Objectively verifiable**: can be checked programmatically or by reading specific outputs
      - **Discriminating**: pass when config works, fail when it doesn't (if baseline also passes, the assertion doesn't test the config)
      - **Specific**: check concrete criteria, not vague quality

      Examples of good (artifact-based) assertions:
      - "result.md exists and contains status: done"
      - "plugins/x/plugin.yaml exists and lists flow y in flows[]"
      - "tasks/z.yaml has >=2 phases, an outputs[] with the declared output, and anti_rationalization"
      - "flows lint --format=json over the produced entities returns [] (exit 0)"
      - "the declared output document was produced and contains section Y"

      Examples of bad assertions:
      - "output looks correct" (subjective)
      - "file exists" without checking content (trivially satisfied)
      - "agent performed well" (not verifiable)
      - "agent followed the phases in order" (NOT checkable — `twinkle run
        list --task_id <id> --limit 1` returns only the run row, not the
        behavioral trace)

  - name: "Interpreting Baseline Comparison"
    content: |
      The baseline comparison answers: "does this configuration actually help?"

      **Config wins**: pass rate higher, agent followed phases, used right tools → configuration adds value
      **Tie**: both pass at similar rates → configuration might not be needed, or assertions aren't discriminating
      **Baseline wins**: agent performed better WITHOUT the config → configuration is overconstrained, confusing, or has bugs

      If baseline wins, investigate:
      - Is the config making the agent overthink simple steps?
      - Are phases too granular, causing the agent to waste time?
      - Are anti-rationalization entries creating confusion instead of preventing shortcuts?
      - Are hard gates blocking valid approaches?

  - name: "Grading boundary — artifacts, not behavioral logs"
    content: |
      This evaluation grades on **artifacts**, because that is what the
      configurator can actually verify repo-locally:

      - **What is graded:** terminal status, the produced entity files and their
        structure, the `flows lint` result over those entities, and the declared
        outputs in result.md. These are objective and deterministic.
      - **What is NOT graded (and why):** the agent's behavioral trace —
        which phases it visited, whether it skipped a step or rationalized a
        shortcut. `twinkle run list --task_id <id> --limit 1` returns only the
        run row (tokens, cost, duration, status), not the JSONL trace, so
        behavioral assertions are not honestly checkable here. Do not write
        assertions that pretend to check them.
      - **Follow-up for behavioral grading:** history-service stores an
        `execution-logs` report per run; exposing it (or an equivalent trace
        command) is the platform change that would let a future
        revision assert on actual phase transitions. Until then, artifact + lint
        grading is the truthful contract — and it is strong: a configuration that
        produces clean-linting, well-structured entities is the deliverable.

terminal_state:
  description: >
    Configuration tested with realistic scenarios, compared against baseline,
    graded with objective artifact-based assertions (produced entity files +
    flows-lint), benchmark compiled, improvements applied iteratively. Final
    report documents pass rates, iterations, and remaining issues, within the
    honest limits of repo-local tooling.
  invoked_by:
    - flow-creation

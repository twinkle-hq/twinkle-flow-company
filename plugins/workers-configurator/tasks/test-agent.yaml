name: test-agent
description: >
  Test a configured agent by creating a test worker, assigning a test task,
  running it, and grading the ARTIFACTS it produces (generated entity files +
  flows-lint result), not execution-log content. Uses the twinkle CLI.
trigger: "User asks to test an agent configuration, verify a role works correctly, run a sandbox test, or validate that a configured worker performs as expected"
complexity: medium
outputs:
  - test_result
  - recommendations

hard_gates:
  - before: create-test-worker
    rule: >
      `twinkle worker create` MUST carry an explicit `--git_repo` naming a
      sandbox repository that already exists. Omitted, the command can create a
      REAL private GitHub repository, and no command in this lane removes it.
      Do not run the command without that flag. This gate is the protection —
      do not go looking for a `--help` line that softens it.
  - before: create-test-worker
    rule: >
      The entity edits under test MUST be committed, pushed, and picked up by
      the platform before the test worker exists. Run
      `twinkle library sync <ws> <namespace>` after the push and before
      `twinkle worker create`; `<namespace>` comes from
      `twinkle library list <ws>`. Do not report a pass or a failure as a
      verdict on a commit you never synced.
  - before: evaluate
    rule: "Task must have reached a terminal state (done, blocked, or failed) before evaluating. Do not evaluate an in-progress task."
  - before: cleanup
    rule: "Evaluation must be documented in the result regardless of pass or fail. Do not skip to cleanup without recording findings."

anti_rationalization:
  title: "Skipping real testing"
  entries:
    - thought: "The validation passed so the agent should work"
      reality: "Validation checks schema, not behavior. An agent can have valid YAML and still fail every task."
    - thought: "I'll just check the config looks right instead of running a real test"
      reality: "Config review catches structural issues. Only a real test reveals runtime failures like wrong MCP tools, missing context, or bad phase flow."
    - thought: "The test task succeeded, so the agent is ready for production"
      reality: "One successful test is necessary but not sufficient. Inspect the produced artifacts: do the generated entity files have the expected structure, and does flows lint pass? A 'done' status with malformed or lint-failing entities is a failure."
    - thought: "I'll read the execution logs to check whether the agent skipped steps"
      reality: "`twinkle run list --task_id <id> --limit 1` returns only the run row — measured on a live stand, its fields are status, started_at, completed_at, duration_seconds, input/output/cache tokens, cost_usd, summary, error, commit_before/after, flow_run_id, flow_name, machine. There is no JSONL behavioral trace in it. Do not read step-by-step behavior out of this command. Grade on the artifacts the agent produced (entity files + flows-lint result) instead. A true behavioral-log read is a follow-up, not something this task can do."
    - thought: "Cleanup isn't important, I'll leave the test worker running"
      reality: "Test workers consume resources. Always clean up. Leftover workers cause confusion in monitoring."
    - thought: "I committed and pushed the entity edits, so the test worker will pick them up"
      reality: "Run `twinkle library sync <ws> <namespace>` after the push and before `twinkle worker create` — the hard gate on create-test-worker mandates it. `<namespace>` comes from `twinkle library list <ws>`. Do not report a pass or a failure as a verdict on a commit you never synced."
    - thought: "`twinkle worker stop` returned, the worker is down — I'll delete it now"
      reality: "The stop call returning is not the worker being stopped. Poll `twinkle worker status <ws> test-<name> --json` until its `state` field is no longer `running`, and only then delete. Measured on a live stand, that read answers `{\"name\":\"configurator\",\"workspace\":\"sandbox\",\"state\":\"stopped\",\"started_at\":null,\"current_task\":null,\"queue_size\":0,...}` — `state` is the field."
    - thought: "`--git_repo` is optional — I'll let the platform pick one"
      reality: "It is not optional here — the hard gate on create-test-worker mandates it, and with no `--git_repo` the command can create a real private GitHub repository. Name an existing sandbox repo on every create."
    - thought: "`twinkle worker create` returned 403 — I'll retry, or find another flag"
      reality: "A 403 with a JSON body is a scope answer, not a transient one. `worker create`, `worker delete`, `worker list` and `worker status` print `scope: admin` under `twinkle <group> <action> --help`. No retry and no flag changes it — see the 'Scope' section. Report it and stop; the configuration under test is not what failed."
    - thought: "`twinkle worker create` failed to connect — the deployment is down, retry it"
      reality: "Read a connection error, or any message naming `http://localhost`, as 'the twinkle CLI is not pointed at a deployment on this machine' — never as 'the platform is down'. Retrying cannot help, `twinkle auth login` cannot help, and inventing a `--url` cannot help. Report 'the twinkle CLI is unconfigured on this machine' and stop — see the 'Scope' section."
    - thought: "`twinkle: command not found` — the mount is broken, I'll install the CLI"
      reality: "Measured in a shell with no such binary: `bash: twinkle: command not found`, exit status 127. There is no `twinkle` command on that machine. Do not install one, do not build one, and do not run `twinkle auth login`. Report 'there is no twinkle command on this machine' and stop — this lane needs the CLI end-to-end and cannot run without it."

phases:
  prepare:
    goal: "Determine what to test and how"
    actions:
      - text: "Identify the role/plugins being tested and their expected capabilities"
        why: "Testing without knowing expected behavior means you can't evaluate results."
      - "Design a test task that exercises the key capabilities"
      - "The test task should be simple but representative — covers main workflow, not edge cases"
    gate: "Test plan ready with specific expected outcomes"
    next: create-test-worker

  create-test-worker:
    tools: ["twinkle library list", "twinkle library sync", "twinkle worker list", "twinkle worker create", "twinkle worker status"]
    goal: "Create a temporary test worker with the target configuration"
    actions:
      - text: >
          First of all, commit and push the entity edits under test, then run
          `twinkle library sync <ws> <namespace>`. The `<namespace>` comes from
          `twinkle library list <ws>`.
        why: >
          `twinkle library sync <ws> <namespace>` prints `scope: worker` and
          `twinkle library list <ws>` prints `scope: admin` under
          `twinkle <group> <action> --help`; both take positionals only, with
          no `--workspace` flag. Do not report a pass or a failure as a verdict
          on a commit you never synced.
      - text: >
          Next, confirm the name is FREE — `twinkle worker list --workspace <ws>`
          and check `test-<name>` is not already there. If it is, pick another
          name.
        why: >
          Do not create over a name that is already there. Creating over an
          existing worker risks reconfiguring one that is not yours — and the
          cleanup phase would then delete it and its Linear label. No error the
          command returns is worth trusting to tell you a collision is what
          happened; the `worker list` check beforehand is what protects you.
          Record in the result that this phase created the worker — cleanup
          depends on knowing that.
      - text: >
          `twinkle worker create <ws> test-<name> --git_repo <existing sandbox repo URL>
          --plugins <p> [--plugins <p> ...]` — a test-prefixed worker name and the
          role's plugins, one `--plugins` per entry.
        why: >
          `<ws>` and the worker name are POSITIONALS on this command, not flags —
          there is no `--workspace` on it, and adding one exits 2 with
          `Unknown option '--workspace'`. `--git_repo` is mandatory (hard gate
          above). Do not pass `--label_id` unless you are deliberately reusing
          an existing Linear label.
      - type: verify
        check: "`twinkle worker status <ws> test-<name>` — the worker exists in config"
        on_fail: >
          Read the error and place it in one of the four answer shapes (Scope
          section). A **`403` with a JSON body** = scope — stop and report, do
          not retry. A **connection error, or any message naming
          `http://localhost`** = the twinkle CLI is unconfigured on this
          machine — stop and report that; a retry cannot help. A **`command not
          found` naming `twinkle`** = there is no CLI here — stop and report
          that; do not install one. Only after ruling out all three is the
          error about the configuration under test and worth fixing and
          retrying.
    gate: "Library synced against the pushed commit under test; test worker created and visible in config"
    next: create-test-task

  create-test-task:
    tools: ["twinkle task create", "twinkle tracker worker-config"]
    goal: "Create a task for the test worker to execute"
    actions:
      - text: >
          `twinkle task create --workspace <ws> --title <t> --description <d>
          --labelIds <worker label id>` — a clear test description that
          exercises the agent's main capability.
        why: "The test task must be specific enough to evaluate but simple enough to succeed in one attempt."
      - text: >
          The label is what addresses the task to the test worker: read the id
          with `twinkle tracker worker-config <ws> test-<name>` (field
          `label_id`) and pass it as `--labelIds`. Repeat the flag for more
          than one label.
        why: "An unlabelled task is picked up by nobody."
      - text: "Do not pass `--stateOverride`."
        why: "Naming a state here is a way to create the task in a state the test worker never picks up."
    gate: "Test task created in Ready status with correct label"
    next: start-and-wait

  start-and-wait:
    tools: ["twinkle worker start", "twinkle worker status"]
    goal: "Start the test worker and wait for task completion"
    actions:
      - text: "`twinkle worker start <ws> test-<name>` — begin the test worker."
        why: >
          Positionals again, no `--workspace` flag. Never treat the call
          returning as the worker being started — the poll below is what
          confirms it.
      - text: "Poll `twinkle worker status <ws> test-<name> --json` periodically until the worker picks up and completes the task"
        why: "Workers are asynchronous. Must wait for the full lifecycle to complete, and a single read can lag what is actually true — poll, do not read once."
      - "Set a reasonable timeout (10-15 minutes for simple tests)"
    gate: "Task reached terminal state (done or blocked)"
    next: evaluate

  evaluate:
    tools: ["twinkle task get", "twinkle run list", Read, Glob, Bash]
    goal: "Assess the test by inspecting the ARTIFACTS the agent produced"
    actions:
      - "`twinkle task get <task-id>` — read the task's terminal status and result.md summary"
      - text: >
          Grade against the PRODUCED ARTIFACTS, not execution-log content.
          The honest, repo-local signals available to you are:
          - The generated entity files. Glob/Read the files the test task was
            supposed to create (plugins/<name>/plugin.yaml, tasks/*.yaml,
            flows/*.yaml, roles/*.yaml, mcp/*.yaml) and check they exist and
            contain the expected structure (correct phases, outputs, triggers,
            session fields — not just "file exists").
          - The flows-lint result. Run `flows lint --format=json` over the
            produced entities; a clean (exit 0 / []) result is a hard,
            objective pass signal — lint failures are a hard fail.
          - result.md outputs. Verify the declared outputs are present and
            non-empty in the result frontmatter.
        why: "`twinkle run list --task_id <id> --limit 1` returns only the run row (measured fields: status, started_at, completed_at, duration_seconds, tokens, cost_usd, summary, machine) — no JSONL behavioral trace. Do not grade the agent's step-by-step reasoning from this task. Grade what is objectively verifiable: the artifacts the agent left behind and whether they lint clean."
      - type: verify
        check: "flows lint --format=json over the produced entities returns [] (exit 0)"
        on_fail: "Record the lint findings as a test failure with the exact filepath:line diagnostics"
      - type: decide
        high_confidence: "Task reached done AND all expected entity files exist with the expected structure AND flows lint is clean → test passes"
        low_confidence: "Task failed, OR an expected entity file is missing/malformed, OR lint reports findings → document the specific artifact gap and recommendations"
    gate: "Evaluation complete with clear pass/fail grounded in artifact + lint evidence"
    next: cleanup

  cleanup:
    tools: ["twinkle worker stop", "twinkle worker status", "twinkle worker delete"]
    goal: "Remove test resources"
    actions:
      - text: >
          `twinkle worker stop <ws> test-<name>` — stop the test worker. Then
          poll `twinkle worker status <ws> test-<name> --json` until its
          `state` field is no longer `running`. Never issue the delete straight
          after the stop.
        why: >
          The stop call returning is not the worker being stopped. Measured on
          a live stand, `worker status --json` answers
          `{"name":"configurator","workspace":"sandbox","state":"stopped",
          "started_at":null,"current_task":null,"queue_size":0, …}` — `state`
          is the field to read.
      - text: >
          `twinkle worker delete <ws> test-<name>` — ONLY if the create phase
          established the name was free and created the worker itself. If you
          reused a worker that already existed, stop here: `stop` is the whole
          of your cleanup.
        why: >
          Delete is destructive beyond this lane's own sandbox. Run
          `twinkle worker delete --help` and read it before you use the
          command: it prints that the call removes the worker's configuration
          in config-service and in the tracker, and deletes **the Linear label
          the worker filed tasks under — the label disappears from every issue
          that carried it**; the worker directory and its git repository are
          left alone, and workspace-keyed history and journal entries survive.
          For a worker this run created moments ago under a `test-` prefix, the
          label is one this run minted and the only issues wearing it are this
          run's test tasks. For a worker that already existed, the label is on
          issues that are not yours — stop at `stop`.
      - type: write_result
        status: done
        summary: "Test {result}: {summary_of_findings}. Recommendations: {recommendations}"
    gate: "Test worker stopped — confirmed by a `worker status` read, not by the stop call returning — and results documented"
    next: null

sections:
  - name: "Scope, and the four shapes an answer can take"
    content: |
      This lane's commands, by the `scope:` line each one's `--help` prints:

      | command | scope |
      |---|---|
      | `twinkle worker create` | admin |
      | `twinkle worker delete` | admin |
      | `twinkle worker list` | admin |
      | `twinkle worker status` | admin (its help prints `operation: worker.list`) |
      | `twinkle tracker worker-config` | admin |
      | `twinkle library list` | admin |
      | `twinkle worker start`, `twinkle worker stop` | worker |
      | `twinkle task create`, `twinkle task get` | worker |
      | `twinkle run list` | worker |
      | `twinkle library sync` | worker |

      Do not trust that table — `twinkle <group> <action> --help` prints the
      operation's `scope:` line, and that is the check.

      **Every command comes back in one of four shapes, and this lane runs
      end-to-end only in the first:**

      1. **It answers.** Every command in the table is available and the lane
         runs.
      2. **`403` with a JSON body.** That is scope: no retry and no flag
         changes it. `twinkle worker list` and `twinkle worker create`, the
         lane's first two actions, are both admin-scoped and can come back this
         way — when they do, the lane cannot start.
      3. **A connection error, or any message naming `http://localhost`.** The
         twinkle CLI is not pointed at a deployment on this machine. A read
         warns on stderr first — measured verbatim: `twinkle: no --url,
         --profile, TWINKLE_URL or stored profile — reading from the default
         vhost http://localhost`.
      4. **A `command not found` error naming `twinkle`.** Measured in a shell
         with no such binary: `bash: twinkle: command not found`, exit status
         127. There is no `twinkle` command on this machine. Do not install
         one and do not build one.

      In shapes 3 and 4: **never run `twinkle auth login` and never invent a
      `--url`**, however strongly the CLI's own error text suggests them. There
      is no credential to log in with and no address you can supply that
      reaches the platform. Neither shape is a broken deployment and neither is
      a retryable failure. Say "the twinkle CLI is unconfigured on this
      machine" (shape 3) or "there is no twinkle command on this machine"
      (shape 4), record that this lane cannot run here, and stop.

      In shapes 2, 3 and 4 alike, what you record is a fact about where this
      session is running — never a defect in the configuration under test.

  - name: "What this meta-test CAN and CANNOT check"
    content: |
      This test grades the configured agent **honestly**, within the limits of
      the repo-local tools available to the configurator.

      **CAN check (the shipped grading):**
      - The agent reached a terminal status (`twinkle task get <id>`).
      - The expected entity files exist and have the right structure
        (Glob/Read the produced `plugins/.../*.yaml`, `roles/*.yaml`, etc.).
      - The produced entities pass `flows lint` (objective, deterministic).
      - The declared `outputs` are present in result.md.

      **CANNOT check:**
      - The agent's step-by-step behavioral trace. `twinkle run list --task_id
        <id> --limit 1` returns only the run row — measured fields: status,
        started_at, completed_at, duration_seconds, input/output/cache tokens,
        cost_usd, summary, error, commit_before/after, flow_run_id, flow_name,
        machine. No JSONL trace. Do not answer "did the agent skip a phase /
        rationalize a shortcut?" from this task, and do not pretend otherwise.

      **Follow-up to enable behavioral grading:** a platform tool that exposes
      the execution trace is needed before a future revision of this task can
      assert on actual phase transitions. Until then, artifact + lint grading is
      the truthful contract.

terminal_state:
  description: >
    Test completed with documented results and recommendations, graded on the
    produced artifacts (entity files + flows-lint), within the honest limits of
    repo-local tooling. Test worker stopped and cleaned up. Test task has
    terminal status.
  invoked_by:
    - design-agent

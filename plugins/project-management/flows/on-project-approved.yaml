name: on-project-approved
version: 1
description: "Trigger task decomposition when a project is approved by human"

params:
  worker_name:
    type: worker

on:
  linear:
    event: project.update
    filters:
      status: [Approved]
  workflow_dispatch: true

jobs:
  decompose:
    type: agent
    task: task-decomposition
    worker: $worker_name
    timeout: 1h

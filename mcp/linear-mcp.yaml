name: linear-mcp
description: Scoped Linear access via the internal MCP proxy.
connection_type: internal
url: http://linear-mcp-proxy:3001
registration_endpoint: http://linear-mcp-proxy:3002/internal/register
registration_payload_fields:
  - task_id
  - task_identifier
  - team_id
  - scope_labels
registration_response:
  token_field: token
  url_field: mcp_url
auth:
  type: internal_secret
